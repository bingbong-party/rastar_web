<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>라별 | 프로젝트</title>
<link rel="canonical" href="https://rastarcomms.com/Projects.html">
<script>
  // 예전 동적 상세 URL(Project.html?id=N)을 정적 상세 페이지로 넘긴다.
  var id = new URLSearchParams(location.search).get("id");
  location.replace(id ? "/projects/" + encodeURIComponent(id) + ".html" : "/Projects.html");
</script>
</head>
<body><a href="/Projects.html">프로젝트 보기</a></body>
</html>
